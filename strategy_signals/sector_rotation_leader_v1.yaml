# DISABLED for v1 — sector-rotation strategy requires sector context.
#
# Without sector context the probe degrades sector_heat_rank to 1,
# intra_sector_strength_rank_pct to 0.0 and fund-flow flags to True, which
# would silently turn this into a bare MA strategy with a misleading "rotation"
# label. Disabled until sector data (board rankings / fund flow) is wired in.
disabled: true
disable_reason: needs_sector_context
api_version: 1
warmup_days: 120
meta:
  id: sector_rotation_leader_v1
  family: sector_rotation
  name: 板块轮动龙头跟随
  version: 1
  parent_id: null
  created_at: '2026-08-13'
  market: a_share
  category: rotation
  tags:
  - 板块轮动
  - 龙头
  - 资金流向
  preferred_regime:
  - trending_up
  - volatile
  experimental: true
description: '板块轮动策略。需要板块热度/资金流数据源；v1 禁用。'
universe:
  market:
  - a_share_main
entry:
  logic: and
  conditions:
  - indicator: sector_heat_rank
    op: <=
    value: 10
  - indicator: sector_heat_rising_days
    op: '>='
    value: 2
  - indicator: intra_sector_strength_rank_pct
    op: <=
    value: 0.2
  - indicator: ma5_ge_ma10_or_crossing
    op: ==
    value: true
  filters:
  - indicator: sector_net_inflow_days
    op: '>='
    value: 2
  - indicator: st_flag
    op: ==
    value: false
exit:
  stop_loss:
    type: composite
    conditions:
    - indicator: sector_heat_rank
      op: '>'
      value: 10
    - indicator: close_below_ma10
      op: ==
      value: true
  take_profit:
    type: trailing
    trigger_pct: 0.08
    trail_pct: 0.04
  max_holding_days: 15
params:
  tunable:
  - target: entry.conditions[indicator=sector_heat_rank].value
    range:
    - 5
    - 20
    step: 1
    label: 板块热度排名阈值
  - target: entry.conditions[indicator=intra_sector_strength_rank_pct].value
    range:
    - 0.1
    - 0.3
    step: 0.05
    label: 板块内强度排名百分位
  - target: exit.take_profit.trigger_pct
    range:
    - 0.05
    - 0.15
    step: 0.01
    label: 移动止盈触发比例