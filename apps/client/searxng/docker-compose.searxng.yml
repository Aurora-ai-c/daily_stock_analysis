services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: dsa-searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/search?q=test&format=json').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
